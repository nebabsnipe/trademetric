<meta name="claude:viewport-fit-sides" content="cover">
<title>Matchup Redesigns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Kanit:ital,wght@0,700;0,800;1,600;1,700;1,800&display=swap">
<style>
/* Layout: a switcher picks one of six takes on the same matchup card; the card sits in a resizable stage so desktop and phone widths can be compared. Tokens are the live site's own. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F0F1F4; --surface-3:#E6E8EC; --ink:#0B0C0E; --muted:#636872; --line:#E2E4E8;
  --accent:#FF4F12; --accent-ink:#FFFFFF; --accent-soft:#FFEDE4;
  --good:#0F9D4F; --good-soft:#E2F5EA; --bad:#E0373B; --bad-soft:#FCE6E6;
  --up:#3B82F6; --proj:#4A4F58;
  --shadow:0 1px 2px rgba(11,12,14,.05),0 6px 20px rgba(11,12,14,.06);
  --f-display:"Kanit","Arial",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050607; --surface:#0F1113; --surface-2:#16191C; --surface-3:#1F2327; --ink:#F2F3F5; --muted:#949AA3; --line:#22262A;
  --accent:#FF6A33; --accent-ink:#170700; --accent-soft:#2B1409;
  --good:#3CD88A; --good-soft:#0E2A1B; --bad:#FF6B6E; --bad-soft:#2F1213;
  --up:#5B9BFF; --proj:#B4B9C1; --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050607; --surface:#0F1113; --surface-2:#16191C; --surface-3:#1F2327; --ink:#F2F3F5; --muted:#949AA3; --line:#22262A;
  --accent:#FF6A33; --accent-ink:#170700; --accent-soft:#2B1409;
  --good:#3CD88A; --good-soft:#0E2A1B; --bad:#FF6B6E; --bad-soft:#2F1213;
  --up:#5B9BFF; --proj:#B4B9C1; --shadow:0 0 0 1px rgba(255,255,255,.04); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 6px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:clamp(28px,4.4vw,40px);text-transform:uppercase;line-height:.95;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:9px;background:var(--surface-3)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button b{font-family:var(--f-display);font-style:italic;font-weight:800;margin-right:6px;color:var(--accent)}
.seg.opts{flex:1 1 100%}.seg.opts button{flex:1 1 auto}
.ctl-l{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:-10px}
@media (max-width:700px){.view-ctl{display:none}.seg.opts button{flex:1 1 30%}}
.about h2{margin:0;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.about p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.stage{container-type:inline-size;container-name:mock;width:100%;max-width:1000px;margin-inline:auto;transition:max-width .25s ease}
.stage.phone{max-width:366px}
@media (prefers-reduced-motion: reduce){.stage{transition:none}}
.foot{margin:0;font-size:12.5px;color:var(--muted);text-align:center}

/* ---------- shared card pieces ---------- */
.card{--me:#E0373B;--opp:#1FA85A;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.card-h .note{white-space:nowrap}
.card-h h2{white-space:nowrap;margin:0;font-family:var(--f-display);font-style:italic;font-weight:700;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.note{font-size:12.5px;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sq{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:1px;flex:none}
.tn{font-family:var(--f-display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.big{font-family:var(--f-display);font-style:italic;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.sec-h b{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.key{font-size:12px;color:var(--muted)}
.pl{display:flex;align-items:center;gap:9px;min-width:0}.pl.r{flex-direction:row-reverse;text-align:right}
.jy{width:28px;height:28px;flex:none}
.meta{display:flex;flex-direction:column;min-width:0}
.pn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh{display:none}
.chip{display:inline-block;font:600 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;background:var(--surface-2);color:var(--muted);margin-left:2px}
.chip.easy{background:var(--good-soft);color:var(--good)}.chip.hard{background:var(--bad-soft);color:var(--bad)}
.fin{font:600 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;background:var(--surface-3);color:var(--ink)}
.pt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:400;color:var(--proj)}
.pt.final{font-weight:700;color:var(--ink)}
.slot{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:13.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.rows{position:relative}
.peek .more{display:none!important}
.peek .rows::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--surface))}
.all{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-weight:600;font-size:13.5px}
.all:hover{border-color:var(--accent);color:var(--accent)}
.card:not(.peek) .all svg{transform:rotate(180deg)}
.wbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.wbar i{display:block;height:100%}.wbar i:first-child{background:var(--me)}.wbar i:last-child{background:var(--opp)}
@container mock (max-width:620px){
  .card{padding:14px}.card-h h2{font-size:17px}.sec-h{flex-direction:column;gap:2px}.tn{white-space:normal}.a-row .pp,.e-row .pp{display:none}.fl{display:none}.sh{display:inline}.chip{display:none}.jy{width:22px;height:22px}.pl{gap:6px}.pn{font-size:13px}.pt{font-size:13.5px}
}

/* ---------- A · Scoreboard ---------- */
.a-sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);background:var(--surface-2);border-radius:var(--r);overflow:hidden}
.a-t{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;min-width:0}.a-t.r{flex-direction:row-reverse;text-align:right}
.a-id{display:flex;flex-direction:column;min-width:0}.a-id .tn{font-size:21px}
.a-t .big{font-size:50px}
.a-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 20px;background:var(--surface-3);text-align:center}
.a-mid b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:30px;line-height:1;color:var(--accent)}
.a-mid span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.a-sub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.a-row{display:grid;grid-template-columns:minmax(0,1fr) 60px 70px 60px minmax(0,1fr);align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.a-row:last-child{border-bottom:0}
.a-row .pt:nth-child(2){text-align:right}
.a-slot{display:flex;align-items:center;justify-content:center;gap:6px}
.car{width:0;height:0;border-block:5px solid transparent;visibility:hidden}
.car.l{border-right:6px solid var(--me)}.car.rt{border-left:6px solid var(--opp)}.car.on{visibility:visible}
@container mock (max-width:620px){
  .a-t,.a-t.r{flex-direction:column;align-items:flex-start;gap:6px;padding:12px}.a-t.r{align-items:flex-end}
  .a-id .tn{font-size:15px}.a-t .big{font-size:34px}.a-mid{padding:8px 10px}.a-mid b{font-size:22px}.a-mid span{white-space:normal;max-width:6ch;line-height:1.15}
  .a-row{grid-template-columns:minmax(0,1fr) 40px 56px 40px minmax(0,1fr)}.a-slot{gap:3px}
}

/* ---------- B · Tug of war ---------- */
.b-panel{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);overflow:hidden}
.b-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:18px 20px}
.b-team{display:flex;align-items:center;gap:12px;min-width:0}.b-team.r{flex-direction:row-reverse;text-align:right}
.b-logo{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--tc);color:#fff;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.03em;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.b-id{display:flex;flex-direction:column;gap:2px;min-width:0}.b-id .tn{font-size:21px}
.b-score{display:flex;align-items:center;gap:22px}
.b-sc{display:flex;flex-direction:column;align-items:center;min-width:92px}.b-sc .big{font-size:48px}
.b-sc small{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:4px}
.b-div{width:1px;height:44px;background:var(--line)}
.b-meter{padding:12px 20px 15px;border-top:1px solid var(--line);background:var(--surface)}
.b-ml{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.b-ml b{font:700 14px var(--f-mono);color:var(--ink)}.b-ml span:first-child b{color:var(--accent)}
.b-ml .c{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.b-ml span:last-child{text-align:right}
.b-meter .wbar{height:8px}
.peek .rows:has(.b-row)::after{display:none}
.b-hd,.b-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.3fr) minmax(0,1fr);align-items:center;gap:18px;padding:11px 10px}
.b-hd{padding-block:8px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.b-hd span:nth-child(2){text-align:center}.b-hd span:last-child{text-align:right}
.b-row{border-top:1px solid var(--line);transition:background .15s}
.b-row:hover{background:var(--surface-2)}
.b-tug{display:grid;grid-template-columns:46px minmax(0,1fr) 56px minmax(0,1fr) 46px;align-items:center;gap:10px}
.b-tr{display:flex;height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}.b-tr.l{justify-content:flex-end}
.b-tr i{display:block;height:100%;min-width:6px;border-radius:99px;background:var(--tc);transform-origin:left;animation:b-grow .55s cubic-bezier(.2,.7,.2,1) both}
.b-tr.l i{transform-origin:right}
.b-tr i.up{background:color-mix(in srgb,var(--tc) 46%,var(--surface-3))}
@keyframes b-grow{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){.b-tr i{animation:none}.b-row{transition:none}}
.b-tug .slot{text-align:center;font-size:12px;line-height:1;padding:5px 0;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.b-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}.b-v.l{text-align:right}
.b-v.won{color:var(--ink);font-weight:700}
.b-row.tot{border-top:2px solid var(--ink);background:none}
.b-row.tot .b-tr{height:14px}.b-row.tot .b-v{font-size:16px}.b-row.tot .slot{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.b-tl{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
@container mock (max-width:620px){
  .b-top{gap:8px;padding:12px}.b-team,.b-team.r{flex-direction:column;align-items:flex-start;gap:6px}.b-team.r{align-items:flex-end}
  .b-logo{width:32px;height:32px;border-radius:8px;font-size:13px}.b-id .tn{font-size:13.5px}
  .b-score{gap:10px}.b-sc{min-width:0}.b-sc .big{font-size:30px}.b-sc small{font-size:10.5px}.b-div{height:34px}
  .b-meter{padding:10px 12px 12px}.b-ml{font-size:11.5px;gap:6px}.b-ml .c{font-size:10px}
  .b-hd,.b-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:10px 2px}.b-hd span:nth-child(2){display:none}
  .b-row.tot .b-v{font-size:13.5px}.b-row.tot .b-tug{grid-template-columns:46px minmax(0,1fr) 46px minmax(0,1fr) 46px}.b-ml span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.b-row .b-tug{grid-column:1/-1;grid-row:2}.b-tug{grid-template-columns:38px minmax(0,1fr) 46px minmax(0,1fr) 38px;gap:6px}.b-v{font-size:13px}
}

/* ---------- C · Edges ---------- */
.c-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.c-box{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;align-items:baseline}
.c-box .tn{font-size:20px}.c-box .big{font-size:34px;text-align:right}.c-box .rec{font-family:var(--f-body);font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted);text-transform:none;margin-left:8px;letter-spacing:0}
.c-box .pj{font:500 12.5px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.c-call{padding:12px 16px;border-radius:var(--r);background:var(--surface-2);text-align:center;min-width:170px}
.c-call b{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:34px;line-height:1;color:var(--accent)}
.c-call span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.c-call em{display:block;font-style:normal;font-size:12px;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.c-hd,.c-row{display:grid;grid-template-columns:44px minmax(0,1fr) 76px;gap:10px;align-items:center}
.c-hd{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.c-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.c-side{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.c-row{padding:8px 0;border-top:1px solid var(--line)}
.edge{justify-self:end;font:700 12.5px var(--f-mono);font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:6px;min-width:62px;text-align:center}
.edge.up{background:var(--good-soft);color:var(--good)}.edge.dn{background:var(--bad-soft);color:var(--bad)}
.c-hd span:last-child{text-align:right}
@container mock (max-width:620px){
  .c-top{grid-template-columns:minmax(0,1fr)}.c-box .tn{font-size:15px}.c-box .big{font-size:26px}.c-box{gap:4px 10px}
  .c-call{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;text-align:left;align-items:center;padding:10px 12px}.c-call b{font-size:28px;grid-row:1/3}.c-call em{margin:0;padding:0;border:0}
  .c-hd,.c-row{grid-template-columns:32px minmax(0,1fr) 64px;gap:8px}.c-pair{grid-template-columns:minmax(0,1fr);gap:5px}.c-hd .c-pair span:last-child{display:none}
  .edge{min-width:56px;padding:4px 6px}
}

/* ---------- D · What's left ---------- */
.d-chance{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.d-chance b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:34px;line-height:1;color:var(--accent)}
.d-bars{display:flex;flex-direction:column;gap:12px}
.d-row{display:grid;grid-template-columns:190px minmax(0,1fr) 128px;gap:14px;align-items:center}
.d-nm{min-width:0;display:flex;flex-direction:column}.d-nm .tn{font-size:17px}
.d-track{display:flex;height:22px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.d-track i{display:block;height:100%}
.d-track .s{background:var(--tc)}
.d-track .p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tc) 50%,transparent) 0 4px,color-mix(in srgb,var(--tc) 20%,transparent) 4px 8px)}
.d-tot{text-align:right;white-space:nowrap}.d-tot .big{font-size:28px}.d-tot .pj{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.d-say{margin:14px 0 0;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:13px}
.d-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}
.d-ch{font-size:12px;font-weight:700;padding:8px 0 2px;display:flex;align-items:center}
.d-ch.r{justify-content:flex-end}
.d-it{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.d-grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:14px}
.d-grp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.d-grp.up{--c:var(--up)}.d-grp.done{--c:var(--muted)}
.d-grp:first-child{margin-top:8px}
@container mock (max-width:620px){
  .d-row{grid-template-columns:minmax(0,1fr) auto;gap:5px 10px}.d-track{grid-column:1/-1;grid-row:2;height:16px}.d-nm .tn{font-size:14.5px}.d-tot{display:flex;align-items:baseline;gap:8px}.d-tot .big{font-size:22px}.d-tot .pj{display:inline}
  .d-cols{gap:0 12px}.d-it{grid-template-columns:26px minmax(0,1fr) auto;gap:5px}.d-it .jy{display:none}.d-it .slot{font-size:11.5px}.d-say{font-size:12.5px}
}

/* ---------- E · Team colors ---------- */
.e-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(100deg,color-mix(in srgb,var(--me) 17%,var(--surface)) 0 calc(50% - 1px),color-mix(in srgb,var(--opp) 17%,var(--surface)) calc(50% + 1px))}
.e-t{display:flex;flex-direction:column;gap:2px;padding:16px 60px 16px 18px;min-width:0}.e-t.r{align-items:flex-end;text-align:right;padding:16px 18px 16px 60px}
.e-t .tn{font-size:22px}.e-t .big{font-size:56px;margin-top:6px}
.e-t .pj{font:500 12.5px var(--f-mono);color:var(--muted)}
.e-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 5px color-mix(in srgb,var(--surface) 55%,transparent)}
.e-badge b{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:28px;line-height:1;color:var(--accent)}
.e-badge span{font-size:10.5px;line-height:1.15;color:var(--muted);max-width:7ch}
.e-hero+.wbar{margin-top:8px;height:6px}
.e-row{display:grid;grid-template-columns:minmax(0,1fr) 66px 52px 66px minmax(0,1fr);gap:6px;align-items:center;padding:6px 0}
.e-row .slot{text-align:center}
.e-pt{display:block;text-align:center;padding:7px 0;border-radius:6px}
.e-pt.won.me{background:color-mix(in srgb,var(--me) 16%,transparent);color:var(--ink);font-weight:700}
.e-pt.won.op{background:color-mix(in srgb,var(--opp) 18%,transparent);color:var(--ink);font-weight:700}
@container mock (max-width:620px){
  .e-t{padding:12px 34px 12px 12px}.e-t.r{padding:12px 12px 12px 34px}.e-t .tn{font-size:14.5px}.e-t .big{font-size:36px}
  .e-badge{width:64px;height:64px}.e-badge b{font-size:20px}.e-badge span{font-size:9.5px}
  .e-row{grid-template-columns:minmax(0,1fr) 46px 36px 46px minmax(0,1fr);gap:4px}.e-row .slot{font-size:11.5px}
}

/* ---------- F · Position cards ---------- */
.f-top{display:grid;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);gap:12px;align-items:center}
.f-team{display:flex;flex-direction:column;gap:1px;min-width:0}.f-team.r{align-items:flex-end;text-align:right}
.f-team .tn{font-size:20px}.f-team .big{font-size:48px;margin-top:6px}.f-team .pj{font:500 12.5px var(--f-mono);color:var(--muted)}
.f-dial{position:relative}.f-dial svg{display:block;width:100%}
.f-dial path{fill:none;stroke-width:14;stroke-linecap:round}.f-dial .bg{stroke:var(--surface-3)}.f-dial .fg{stroke:var(--accent)}
.f-dial div{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.f-dial b{display:block;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:40px;line-height:.95;color:var(--accent)}
.f-dial span{font-size:12px;color:var(--muted)}
.f-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:6px}
.f-card{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.f-ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.f-ch em{font-style:normal;font:700 11.5px var(--f-mono);font-variant-numeric:tabular-nums}
.f-ch em.up{color:var(--good)}.f-ch em.dn{color:var(--bad)}
.f-line{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0}
.f-line+.f-line{border-top:1px solid var(--line)}
.f-line>i{width:4px;height:22px;border-radius:2px;background:transparent}
.f-line.won.me>i{background:var(--me)}.f-line.won.op>i{background:var(--opp)}
.f-line.won .pn{font-weight:700}.f-line:not(.won) .pn{font-weight:500}
@container mock (max-width:820px){.f-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container mock (max-width:620px){
  .f-top{grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);gap:6px}.f-team .tn{font-size:14px}.f-team .big{font-size:32px}
  .f-dial path{stroke-width:16}.f-dial b{font-size:22px}.f-dial span{font-size:9.5px;display:block;line-height:1.1}.f-dial div{bottom:-14px}
  .f-top{padding-bottom:14px}.f-grid{grid-template-columns:minmax(0,1fr);gap:8px}.f-card .jy{display:block}
}
</style>

<div class="page">
  <header>
    <p class="eyebrow">TradeMetric · My Team</p>
    <h1>Week 12 matchup, six ways</h1>
    <p class="lede">Six takes on the matchup card, each built with your real Week 12 numbers and the site's own fonts and colors. Flip between them, then check each one at phone width.</p>
  </header>

  <div class="ctl">
    <div class="seg opts" id="opts" role="group" aria-label="Design option"></div>
    <span class="ctl-l view-ctl">Width</span>
    <div class="seg view-ctl" id="view" role="group" aria-label="Preview width">
      <button type="button" id="view-desktop" data-v="desktop" aria-pressed="true">Desktop</button>
      <button type="button" id="view-phone" data-v="phone" aria-pressed="false">Phone</button>
    </div>
    <span class="ctl-l">Lineup</span>
    <div class="seg" id="len" role="group" aria-label="Lineup length">
      <button type="button" id="len-full" data-l="full" aria-pressed="true">All positions</button>
      <button type="button" id="len-peek" data-l="peek" aria-pressed="false">First three</button>
    </div>
  </div>

  <div class="about"><h2 id="o-name"></h2><p id="o-desc"></p></div>
  <div class="stage" id="stage"><section class="card" id="mock" aria-live="polite"></section></div>
  <p class="foot">Preview only. Nothing on trademetric.app has changed.</p>
</div>

<script>
const ME={name:'Naughty Nathan',rec:'5-6',pts:5.8,proj:99.4},OP={name:'Burrow It Deep',rec:'3-8',pts:57.4,proj:136.8},PW=.06;
const P=(n,pos,num,c,opp,rk,tone,v,st,ct)=>({n,pos,num,c,opp,rk,tone,v,st,ct:ct||'#fff'});
const ROWS=[
 ['QB',P('Kirk Cousins','QB',8,'#4F2683','vs ATL','27th','easy',19.9,'up'),P('Joe Burrow','QB',9,'#FB4F14','vs NO','15th','',26.8,'up')],
 ['RB',P('Chase Brown','RB',30,'#FB4F14','vs NO','31st','easy',19.4,'up'),P('Omarion Hampton','RB',8,'#0080C6','vs NE','18th','',9.8,'up')],
 ['RB',P('Samaje Perine','RB',34,'#FB4F14','vs NO','31st','easy',9.5,'up'),P('Jordan Mason','RB',27,'#4F2683','vs ATL','28th','easy',8.1,'up')],
 ['WR',P('Justin Jefferson','WR',18,'#4F2683','vs ATL','27th','easy',17.0,'up'),P('DeVonta Smith','WR',6,'#004C54','','','',43.0,'final')],
 ['WR',P('DJ Moore','WR',2,'#0B2A6F','','','',3.5,'final'),P('Ladd McConkey','WR',15,'#0080C6','vs NE','31st','easy',11.7,'up')],
 ['TE',P('Brock Bowers','TE',89,'#15171A','at CLE','22nd','',15.4,'up'),P('Sam LaPorta','TE',87,'#0076B6','','','',14.4,'final')],
 ['FLEX',P('Josh Downs','WR',12,'#C8102E','','','',2.3,'final'),P('Jordyn Tyson','WR',0,'#D3BC8D','at CIN','9th','hard',6.5,'up','#1A1A1A')],
 ['K',P('Cameron Dicker','K',11,'#0080C6','vs NE','16th','',6.9,'up'),P('Will Reichard','K',16,'#4F2683','vs ATL','10th','',9.8,'up')],
 ['D/ST',P('Browns D/ST','DST','D','#4B2A14','vs LV','','',5.6,'up'),P('Bengals D/ST','DST','D','#FB4F14','vs NO','','',6.7,'up')]
];
const f1=x=>x.toFixed(1),sg=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1);
const sq=k=>`<i class="sq" style="background:var(--${k})"></i>`;
const jy=p=>`<svg class="jy" viewBox="0 0 28 28" aria-hidden="true"><path d="M9 3.5 4.5 6 1.5 11.5l4 2L7 12v12.5h14V12l1.5 1.5 4-2L23.5 6 19 3.5c-1.2 2.4-8.8 2.4-10 0z" fill="${p.c}" stroke="rgba(128,128,128,.5)" stroke-width=".8"/><text x="14" y="19" text-anchor="middle" font-size="9.5" font-weight="700" font-style="italic" font-family="Kanit,Arial,sans-serif" fill="${p.ct}">${p.num}</text></svg>`;
const sh=n=>n.includes('D/ST')?n.split(' ')[0]:n.split(' ').slice(1).join(' ');
const nm=p=>`<span class="pn"><span class="fl">${p.n}</span><span class="sh">${sh(p.n)}</span></span>`;
const sub=p=>`<span class="ps"><span class="pp">${p.pos==='DST'?'D/ST':p.pos} · </span>${p.st==='final'?'<span class="fin">Final</span>':p.opp+(p.rk?` <span class="chip ${p.tone}">${p.rk} v ${p.pos}</span>`:'')}</span>`;
const pl=(p,r)=>`<div class="pl${r?' r':''}">${jy(p)}<div class="meta">${nm(p)}${sub(p)}</div></div>`;
const pt=(p,c)=>`<span class="pt ${p.st==='final'?'final':''} ${c||''}">${f1(p.v)}</span>`;
const mo=i=>i>=3?' more':'';
const left=s=>ROWS.filter(r=>r[s].st!=='final').length;
const wbar=`<div class="wbar" aria-hidden="true"><i style="width:${PW*100}%"></i><i style="width:${(1-PW)*100}%"></i></div>`;
const KEY='<span class="key">Bold = final score · lighter = projection</span>';

const D={
a:{name:'Scoreboard',desc:'The scores move next to each other like a real scoreboard, so the gap is the first thing you see. The lineup loses its colored stripes and legend. A small arrow points at whoever is ahead at each position.',
 head:()=>`<div class="a-sb">
   <div class="a-t"><div class="a-id"><span class="tn">${sq('me')}${ME.name}</span><span class="note">${ME.rec} · proj ${f1(ME.proj)}</span></div><span class="big">${f1(ME.pts)}</span></div>
   <div class="a-mid"><b>${Math.round(PW*100)}%</b><span>chance you win</span></div>
   <div class="a-t r"><div class="a-id"><span class="tn">${sq('opp')}${OP.name}</span><span class="note">${OP.rec} · proj ${f1(OP.proj)}</span></div><span class="big">${f1(OP.pts)}</span></div></div>
  <div class="a-sub"><span>${left(1)} still to play</span><span>${left(2)} still to play</span></div>`,
 body:()=>ROWS.map(([s,a,b],i)=>`<div class="a-row${mo(i)}">${pl(a)}${pt(a)}<span class="a-slot"><i class="car l${a.v>=b.v?' on':''}"></i><span class="slot">${s}</span><i class="car rt${b.v>a.v?' on':''}"></i></span>${pt(b)}${pl(b,1)}</div>`).join(''),key:KEY},

b:{name:'Tug of war',desc:'Every position is a pair of bars growing out from the middle, so you can see who wins each spot and by how much at a glance. Solid bars are final scores, lighter bars are projections, and the bottom line adds it all up.',
 head:()=>{const team=(T,k,ini,r)=>`<div class="b-team${r?' r':''}" style="--tc:var(--${k})"><span class="b-logo">${ini}</span><div class="b-id"><span class="tn">${T.name}</span><span class="note">${T.rec}</span></div></div>`,sc=T=>`<div class="b-sc"><span class="big">${f1(T.pts)}</span><small>proj ${f1(T.proj)}</small></div>`,pc=Math.round(PW*100);
  return `<div class="b-panel"><div class="b-top">${team(ME,'me','NN')}<div class="b-score">${sc(ME)}<i class="b-div"></i>${sc(OP)}</div>${team(OP,'opp','BD',1)}</div>
   <div class="b-meter"><div class="b-ml"><span><b>${pc}%</b> you</span><span class="c">Chance to win</span><span>${OP.name} <b>${100-pc}%</b></span></div>${wbar}</div></div>`},
 body:()=>{const mx=Math.max(...ROWS.flatMap(r=>[r[1].v,r[2].v])),bar=(p,m)=>`<i class="${p.st==='final'?'':'up'}" style="width:${(p.v/m*100).toFixed(1)}%"></i>`,
   tug=(a,b,s,m)=>`<div class="b-tug"><span class="b-v l${a.v>=b.v?' won':''}">${f1(a.v)}</span><div class="b-tr l" style="--tc:var(--me)">${bar(a,m)}</div><span class="slot">${s}</span><div class="b-tr" style="--tc:var(--opp)">${bar(b,m)}</div><span class="b-v${b.v>a.v?' won':''}">${f1(b.v)}</span></div>`;
  return `<div class="b-hd"><span>You</span><span>Points</span><span>${OP.name}</span></div>`+ROWS.map(([s,a,b],i)=>`<div class="b-row${mo(i)}">${pl(a)}${tug(a,b,s,mx)}${pl(b,1)}</div>`).join('')
   +`<div class="b-row tot"><span class="b-tl">Projected total</span>${tug({v:ME.proj,st:'up'},{v:OP.proj,st:'up'},'Total',OP.proj)}<span></span></div>`},key:'<span class="key">Solid = final · lighter = projected</span>'},

c:{name:'Position edges',desc:'A box score up top, and one clear number at the end of every row: how many points you are ahead or behind at that position. Green is your edge, red is theirs. The best fit for spotting where a matchup is being lost.',
 head:()=>`<div class="c-top"><div class="c-box">
    <span class="tn">${sq('me')}${ME.name}<span class="rec">${ME.rec}</span></span><span class="pj">proj ${f1(ME.proj)}</span><span class="big">${f1(ME.pts)}</span>
    <span class="tn">${sq('opp')}${OP.name}<span class="rec">${OP.rec}</span></span><span class="pj">proj ${f1(OP.proj)}</span><span class="big">${f1(OP.pts)}</span></div>
   <div class="c-call"><b>${Math.round(PW*100)}%</b><span>chance you win</span><em>Projected ${sg(ME.proj-OP.proj)}</em></div></div>`,
 sec:()=>`Position by position · you lead ${ROWS.filter(r=>r[1].v>=r[2].v).length} of ${ROWS.length}`,
 body:()=>`<div class="c-hd"><span></span><div class="c-pair"><span>You</span><span>${OP.name}</span></div><span>Edge</span></div>`+ROWS.map(([s,a,b],i)=>`<div class="c-row${mo(i)}"><span class="slot">${s}</span><div class="c-pair"><div class="c-side">${pl(a)}${pt(a)}</div><div class="c-side">${pl(b)}${pt(b)}</div></div><span class="edge ${a.v>=b.v?'up':'dn'}">${sg(a.v-b.v)}</span></div>`).join(''),key:KEY},

d:{name:"What's left",desc:'Built around the question you actually have on Sunday: can I still catch up? Each team gets one bar showing points already scored plus points still expected, and the lineup is split into who has yet to play and who is done.',
 head:()=>{const mx=140,row=(T,k)=>`<div class="d-row" style="--tc:var(--${k})"><div class="d-nm"><span class="tn">${sq(k)}${T.name}</span><span class="note">${T.rec}</span></div><div class="d-track"><i class="s" style="width:${T.pts/mx*100}%"></i><i class="p" style="width:${(T.proj-T.pts)/mx*100}%"></i></div><div class="d-tot"><span class="big">${f1(T.pts)}</span><span class="pj">proj ${f1(T.proj)}</span></div></div>`;
  const gap=OP.pts-ME.pts,mk=(ME.proj-ME.pts)-(OP.proj-OP.pts);
  return `<div class="d-chance"><b>${Math.round(PW*100)}%</b><span class="note">chance you win</span></div><div class="d-bars">${row(ME,'me')}${row(OP,'opp')}</div>
  <p class="d-say">You trail by <b class="num">${f1(gap)}</b>. Your ${left(1)} players left are projected to win back <b class="num">${f1(mk)}</b> of it.</p>`},
 sec:()=>'Lineups',
 body:()=>{const it=(s,p,i)=>`<div class="d-it${mo(i)}"><span class="slot">${s}</span>${pl(p)}${pt(p)}</div>`,col=(side,st)=>ROWS.filter(r=>(r[side].st==='final')===(st==='final')).map((r,i)=>it(r[0],r[side],i)).join('');
  return `<div class="d-grp up">Still to play</div><div class="d-cols"><div><div class="d-ch">${sq('me')}You · ${left(1)} left</div>${col(1,'up')}</div><div><div class="d-ch">${sq('opp')}${OP.name} · ${left(2)} left</div>${col(2,'up')}</div></div>
   <div class="more"><div class="d-grp done">Final</div><div class="d-cols"><div>${col(1,'final').replace(/ more/g,'')}</div><div>${col(2,'final').replace(/ more/g,'')}</div></div></div>`},key:'<span class="key">Solid = scored · striped = still projected</span>'},

e:{name:'Team colors',desc:'The boldest one. Each team gets its own color block with a win-chance badge sitting on the seam, and the winning number at each position is highlighted in that team\'s color. Closest in feel to a TV graphic.',
 head:()=>`<div class="e-hero"><div class="e-t"><span class="tn">${ME.name}</span><span class="note">${ME.rec}</span><span class="big">${f1(ME.pts)}</span><span class="pj">proj ${f1(ME.proj)}</span></div>
   <div class="e-t r"><span class="tn">${OP.name}</span><span class="note">${OP.rec}</span><span class="big">${f1(OP.pts)}</span><span class="pj">proj ${f1(OP.proj)}</span></div>
   <div class="e-badge"><b>${Math.round(PW*100)}%</b><span>chance you win</span></div></div>${wbar}`,
 body:()=>ROWS.map(([s,a,b],i)=>`<div class="e-row${mo(i)}">${pl(a)}${pt(a,'e-pt me'+(a.v>=b.v?' won':''))}<span class="slot">${s}</span>${pt(b,'e-pt op'+(b.v>a.v?' won':''))}${pl(b,1)}</div>`).join(''),key:'<span class="key">Highlighted = ahead at that position</span>'},

f:{name:'Position cards',desc:'A win-chance dial in the middle and one small card per position instead of a long table. On a computer the whole lineup fits in three tidy rows; on a phone the cards stack like a native app list.',
 head:()=>{const c=Math.PI*86;return `<div class="f-top"><div class="f-team"><span class="tn">${sq('me')}${ME.name}</span><span class="note">${ME.rec}</span><span class="big">${f1(ME.pts)}</span><span class="pj">proj ${f1(ME.proj)}</span></div>
   <div class="f-dial"><svg viewBox="0 0 200 112" aria-hidden="true"><path class="bg" d="M14 104 A86 86 0 0 1 186 104"/><path class="fg" d="M14 104 A86 86 0 0 1 186 104" style="stroke-dasharray:${c*PW} ${c}"/></svg><div><b>${Math.round(PW*100)}%</b><span>chance you win</span></div></div>
   <div class="f-team r"><span class="tn">${sq('opp')}${OP.name}</span><span class="note">${OP.rec}</span><span class="big">${f1(OP.pts)}</span><span class="pj">proj ${f1(OP.proj)}</span></div></div>`},
 body:()=>`<div class="f-grid">`+ROWS.map(([s,a,b],i)=>{const w=a.v>=b.v,ln=(p,k,won)=>`<div class="f-line ${k}${won?' won':''}"><i></i>${pl(p)}${pt(p)}</div>`;return `<div class="f-card${mo(i)}"><div class="f-ch"><span class="slot">${s}</span><em class="${w?'up':'dn'}">${sg(a.v-b.v)}</em></div>${ln(a,'me',w)}${ln(b,'op',!w)}</div>`}).join('')+`</div>`,key:KEY}
};

let cur='b',peek=false;
const $=id=>document.getElementById(id),ORDER=Object.keys(D);
$('opts').innerHTML=ORDER.map(k=>`<button type="button" id="opt-${k}" data-o="${k}" aria-pressed="false"><b>${k.toUpperCase()}</b>${D[k].name}</button>`).join('');
function draw(){const d=D[cur],m=$('mock');
  ORDER.forEach(k=>$('opt-'+k).setAttribute('aria-pressed',k===cur));
  $('len-full').setAttribute('aria-pressed',!peek);$('len-peek').setAttribute('aria-pressed',peek);
  $('o-name').textContent=`Option ${cur.toUpperCase()} · ${d.name}`;$('o-desc').textContent=d.desc;
  m.className='card'+(peek?' peek':'');
  m.innerHTML=`<div class="card-h"><h2>Week 12 matchup</h2><span class="note">Next kickoff Sun 10:00 AM</span></div>${d.head()}
   <div class="sec-h"><b>${d.sec?d.sec():'Position by position'}</b>${d.key||''}</div><div class="rows">${d.body()}</div>
   <button type="button" class="all" id="see-all">${peek?`See all ${ROWS.length} positions`:'Show fewer'}<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.o){cur=b.dataset.o;try{history.replaceState(null,'','#option-'+cur)}catch(_){}}
  else if(b.dataset.l)peek=b.dataset.l==='peek';
  else if(b.id==='see-all')peek=!peek;
  else if(b.dataset.v){const ph=b.dataset.v==='phone';$('stage').classList.toggle('phone',ph);$('view-phone').setAttribute('aria-pressed',ph);$('view-desktop').setAttribute('aria-pressed',!ph);return}
  else return;draw()});
function fromHash(){const k=(location.hash.match(/^#option-([a-f])$/)||[])[1];if(k){cur=k;draw()}}
addEventListener('hashchange',fromHash);draw();fromHash();
</script>
