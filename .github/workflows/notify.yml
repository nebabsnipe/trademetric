name: Send phone alerts

# Opens /api/notify every 30 minutes. That address checks every account with phone alerts on (trade deadlines,
# lineup fixes before kickoff) and sends anything new. It is safe to open: it runs at most once every 20 minutes
# and never sends anything twice. GitHub can start scheduled runs a few minutes late; that's fine here.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://www.trademetric.app/api/notify || true
