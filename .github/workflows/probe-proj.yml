name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp api/news.js /tmp/news.mjs
          cat > /tmp/run.mjs <<'JS'
          import h from '/tmp/news.mjs';
          const res={setHeader(){},status(c){this.c=c;return this},json(o){this.o=o;return this}};
          const t=Date.now();
          await h({query:{batch:'Lamar Jackson|BAL;Sam Darnold|SEA;Mike Gesicki|CIN;Jaxson Dart|NYG;Kirk Cousins|LV;Tee Higgins|CIN;Dak Prescott|DAL;Chase Brown|CIN'}},res);
          console.log('STATUS',res.c,'ms',Date.now()-t);
          for(const [k,v] of Object.entries(res.o.items))for(const a of v)console.log('ITEM',k,'|',a.at,'|',a.outlet,'|',a.title,'|',(a.desc||'').slice(0,150));
          JS
          node /tmp/run.mjs 2>&1 | grep -E "STATUS|ITEM"
