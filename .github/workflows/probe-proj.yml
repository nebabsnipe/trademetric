name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /tmp/f.json "https://www.trademetric.app/api/feed?week=9"
          python3 -c "
          import json;d=json.load(open('/tmp/f.json'));n=d.get('news',[]);print('NEWSCOUNT',len(n))
          for a in n:
            t=(a.get('title','')+' '+a.get('desc',''))
            if any(k in t for k in ['Lamar','Darnold','Dart']): print('HIT',a.get('at'),a.get('title'),'|',a.get('desc','')[:200])
          "
