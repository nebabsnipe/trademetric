name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /tmp/p.json -w "HTTP %{http_code} %{time_total}s\n" "https://www.trademetric.app/api/proj?week=9"
          python3 -c "import json;d=json.load(open('/tmp/p.json'));print('week',d.get('week'),'errors',d.get('errors'),{k:len(v) for k,v in d.get('sources',{}).items()}, d.get('error'), d.get('detail'))"
