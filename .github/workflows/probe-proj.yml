name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=$RANDOM
          for u in "api/live?week=9&b=$B" "api/market?b=$B" "api/proj?week=9&b=$B" "api/news?batch=Hunter%20Henry%7CNE&b=$B"; do
            curl -s -o /tmp/o.json -w "URL $u HTTP %{http_code} %{time_total}s\n" "https://www.trademetric.app/$u"
            python3 -c "import json;d=json.load(open('/tmp/o.json'));print('KEYS',list(d.keys()), {k:len(v) for k,v in d.items() if isinstance(v,(list,dict))}, d.get('games',{}).get('BAL'))"
          done
