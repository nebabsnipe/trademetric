name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.trademetric.app/api/feed?week=9&debug=1&b=$RANDOM" | python3 -c "import json,sys;d=json.load(sys.stdin);print('DBG',json.dumps(d.get('debug'))[:1500])"
          curl -s -w "\nCODE %{http_code}\n" "https://site.api.espn.com/apis/fantasy/v2/games/ffl/news/players?limit=5" | head -c 1500; echo
          curl -s -w "\nCODE %{http_code}\n" "https://site.api.espn.com/apis/fantasy/v2/games/ffl/news/players?limit=200&playerId=3916387" | head -c 800; echo
