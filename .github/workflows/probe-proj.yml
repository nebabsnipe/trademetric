name: probe-proj
on:
  push:
    branches: [probe-proj]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://api.sleeper.app/v1/players/nfl" -o /tmp/p.json
          python3 - <<'PY'
          import json;d=json.load(open('/tmp/p.json'))
          keys=set()
          for p in d.values(): keys|=set(p.keys())
          print('SLKEYS',sorted(keys))
          for n in ['Sam Darnold','Lamar Jackson','Tee Higgins','Mike Gesicki']:
            for p in d.values():
              if p.get('full_name')==n: print('SL',n,{k:p.get(k) for k in p if 'injur' in k or 'practice' in k or k in('status','team','news_updated')})
          PY
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=9&dates=2026" -o /tmp/s.json
          python3 - <<'PY'
          import json;d=json.load(open('/tmp/s.json'))
          for ev in d.get('events',[])[:3]:
            c=ev['competitions'][0];print('ODDS',ev.get('shortName'),json.dumps(c.get('odds'))[:700])
          PY
          curl -s "https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=1&numTeams=12&ppr=1" | head -c 600; echo
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries" | head -c 1500; echo
