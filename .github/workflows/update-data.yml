name: Update NFL data

on:
  schedule:
    - cron: "17 13 * * *"   # every day, about 6am Arizona time
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python scripts/update_data.py
      - run: python scripts/yt_channels.py || true
      - name: Commit if the data changed
        run: |
          git config user.name "trademetric-bot"
          git config user.email "trademetric-bot@users.noreply.github.com"
          git add data/nfl.json data/yt_channels.json
          git diff --cached --quiet || git commit -m "Update NFL data $(date -u +%F)"
          git push
